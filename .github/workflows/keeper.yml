name: DCA Keeper

# Cron-Trigger deaktiviert (2026-08-02): GitHub Actions' Schedule-Ausführung
# driftete gemessen 2,6h-11,8h gegenüber dem konfigurierten stündlichen
# Schedule (siehe Commit "Port keeper to run on Cloudflare Workers"). Der
# Keeper läuft seither über einen Cloudflare Worker (keeper/worker.ts,
# keeper/wrangler.toml) mit nativen, pünktlichen Cron Triggers — bestätigt
# per Cloudflare-Dashboard-Metriken (exakt stündliche Invocations, 0 Fehler).
# workflow_dispatch bleibt für manuelle/Debug-Läufe erhalten; die Schedule
# absichtlich NICHT wieder aktivieren, ohne vorher den Cloudflare Worker zu
# deaktivieren — sonst laufen wieder zwei Keeper parallel über dieselbe
# Wallet (KEEPER_PRIVATE_KEY), siehe docs/playbook/lessons-learned.md.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run-keeper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run keeper
        env:
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          SQUID_INTEGRATOR_ID: ${{ secrets.SQUID_INTEGRATOR_ID }}
          FACTORY_ADDRESS: ${{ secrets.FACTORY_ADDRESS }}
        run: npm run keeper
