name: Tests

on:
  push:
    branches: [master]
  pull_request: {}

permissions:
  contents: read

jobs:
  forge-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (with submodules — lib/openzeppelin-contracts, lib/forge-std)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      # `forge test` alone doesn't reliably compile everything under script/
      # -- a deploy script with a real solc error (e.g. a raw non-ASCII
      # character in a string literal, which needs unicode"...") passed
      # `forge test` cleanly here on 02.09.2026 while failing immediately
      # under a plain `forge script`/local `forge test` run. `forge build`
      # explicitly compiles the whole project (contracts/script/test per
      # foundry.toml), so a broken deploy script gets caught in CI instead
      # of surfacing only when someone runs the real deploy.
      - name: forge build (whole project, catches script/-only breakage)
        run: forge build

      - name: forge test
        run: forge test -vvv

  typecheck-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        package:
          - { name: "root (src/keeper)", dir: "." }
          - { name: "apis/app",          dir: "apis/app" }
          - { name: "apis/backend",      dir: "apis/backend" }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # apis/app and apis/backend both import shared code straight from root
      # src/ (e.g. config.ts, minipayWallet.ts) rather than depending on a
      # published package -- tsc follows those imports and needs root's own
      # node_modules (viem etc.) resolvable too, not just the matrix
      # package's. A no-op for the root entry itself (dir: ".").
      - name: Install root dependencies (needed for shared src/ imports)
        if: matrix.package.dir != '.'
        run: npm ci

      - name: Install dependencies (${{ matrix.package.name }})
        working-directory: ${{ matrix.package.dir }}
        run: npm ci

      - name: Type-check (${{ matrix.package.name }})
        working-directory: ${{ matrix.package.dir }}
        run: npx tsc --noEmit

      # Point-in-time check, not a substitute for a real audit (see SECURITY.md) —
      # fails the job on a known production-dependency vulnerability so it can't
      # silently slip past review, same spirit as everywhere else this project
      # values verifying over assuming.
      - name: npm audit (${{ matrix.package.name }}, production dependencies)
        working-directory: ${{ matrix.package.dir }}
        run: npm audit --omit=dev
