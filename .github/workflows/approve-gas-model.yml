name: Approve Gas Model (manual, read-only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run approve gas model
        run: npx tsx keeper/approveGasModel.ts
