name = "apis-keeper"
main = "worker.ts"
compatibility_date = "2026-01-01"

# 5-minütlich statt OSIRIS' stündlichem Rhythmus (keeper/wrangler.toml) —
# Sell-Trigger sind preisreaktiv, nicht zeitgetaktet wie DCA-Tranchen, siehe
# Gesamtplan-Diskussion zur Cron-Frequenz ("5-minütliche Rhythmen sind kein
# Problem").
[triggers]
crons = ["*/5 * * * *"]
